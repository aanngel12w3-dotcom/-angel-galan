<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página personal de Jesús Ángel Galán. Encuentra aquí sus perfiles y enlaces oficiales.">
  <meta name="robots" content="index,follow">
  <title>Jesús Ángel Galán | Página personal</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #172033; background: linear-gradient(145deg, #eef3ff, #f8f9fc 55%, #e9f4f2);
    }
    main {
      width: min(100%, 560px); padding: 42px 30px; text-align: center;
      background: rgba(255,255,255,.94); border: 1px solid #e5e9f2;
      border-radius: 24px; box-shadow: 0 18px 55px rgba(25,40,75,.10);
    }
    .avatar {
      width: 82px; height: 82px; margin: 0 auto 20px; border-radius: 50%;
      display: grid; place-items: center; background: #172b4d; color: white;
      font-size: 26px; font-weight: 700; letter-spacing: 1px;
    }
    h1 { margin: 0; font-size: clamp(27px, 6vw, 36px); letter-spacing: -.8px; }
    p { margin: 12px 0 28px; color: #657087; line-height: 1.6; }
    nav { display: grid; gap: 12px; }
    a {
      display: block; padding: 15px 18px; border-radius: 13px;
      text-decoration: none; font-weight: 650; color: #172033;
      border: 1px solid #dce3ee; background: #fff; transition: .18s ease;
    }
    a:hover { transform: translateY(-2px); border-color: #9aaed0; background: #f7f9fd; }
    footer { margin-top: 28px; color: #8a93a4; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">JG</div>
    <h1>Jesús Ángel Galán</h1>
    <p>Bienvenido a mi página personal. Aquí puedes encontrar mis perfiles y conocer mis espacios en línea.</p>
    <nav aria-label="Perfiles sociales">
      <a href="https://www.linkedin.com/in/jesús-ángel-galán-eche-470b7839a/" target="_blank" rel="noopener noreferrer">Ver mi perfil de LinkedIn ↗</a>
      <a href="https://www.facebook.com/share/1E8nhzScpA/" target="_blank" rel="noopener noreferrer">Ver mi perfil de Facebook ↗</a>
    </nav>
    <footer>© Jesús Ángel Galán</footer>
  </main>
</body>
</html>
